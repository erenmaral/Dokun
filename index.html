<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Dokun!</title>
<style>
  :root { --bg:#0b1020; --ink:#f4f6ff; --panel:#10162a; --panel2:#1b2347; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; overscroll-behavior:none; }
  body { height:100dvh; }
  .noselect { user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; }
  .flip { transform:rotate(180deg); }

  /* ---------- Tahta ve bolgeler ---------- */
  #board { position:fixed; inset:0; display:grid; gap:4px; background:#05070f;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #board.p2 { grid-template-rows:1fr 1fr; }
  #board.p3 { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  #board.p3 .zone:nth-child(3) { grid-column:1 / -1; }
  #board.p4 { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }

  /* Zemin her zaman koyu ve notr: oyuncu rengi yalnizca cerceve, etiket ve parlama olarak kullanilir.
     Boylece yazi, hedef ve secenek renkleri zemine karismaz. */
  .zone { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 50% 40%, var(--panel2) 0%, var(--panel) 72%);
    box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--c) 75%, transparent),
               inset 0 0 50px color-mix(in srgb, var(--c) 26%, transparent);
    padding:22px 16px; overflow:hidden; transition:background .15s, box-shadow .15s;
    text-shadow:0 2px 6px rgba(0,0,0,.45); }
  .zone[data-s="go"]  { background:radial-gradient(120% 90% at 50% 40%, color-mix(in srgb, var(--c) 26%, var(--panel2)) 0%, #121a35 75%); }
  .zone[data-s="sig"] { background:radial-gradient(circle at 50% 45%, #4ade80 0%, #16a34a 85%);
    box-shadow:inset 0 0 0 4px #dcfce7, 0 0 24px #22c55e; }
  .zone[data-s="out"] { background:radial-gradient(circle at 50% 45%, #3b3b48 0%, #23232d 85%);
    box-shadow:inset 0 0 0 3px #666; color:#a1a1aa; }
  .zone[data-s="out"] .cell, .zone[data-s="out"] .opt { opacity:.45; }
  .zone[data-s="win"] { background:radial-gradient(circle at 50% 40%, #fde68a 0%, #f59e0b 90%);
    box-shadow:inset 0 0 0 4px #fff7d6, 0 0 30px #fbbf24; color:#1a1200; text-shadow:none; }
  .zone[data-s="win"] .gname { color:#1a1200; }

  .zone .head { z-index:2; position:absolute; bottom:9px; left:12px; right:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .head .nm { background:var(--c); color:#10162a; font-weight:800; font-size:13px; padding:3px 10px; border-radius:999px;
    text-shadow:none; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.35); }
  .head .gname { flex:1; min-width:0; text-align:center; font-size:12px; font-weight:700; opacity:.85;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .head .score { min-width:34px; text-align:center; background:rgba(0,0,0,.5); color:#fff; border-radius:999px;
    font-size:18px; font-weight:800; padding:1px 10px; text-shadow:none; }

  .zone .body { position:relative; z-index:1; font-size:clamp(26px, 9vmin, 64px); font-weight:900; text-align:center; width:100%; }
  .zone .body.fill { height:calc(100% - 34px); }
  .zone .sub { font-size:15px; font-weight:600; opacity:.85; margin-top:8px; }
  .arena { position:relative; width:100%; height:100%; }
  .cnt { position:absolute; top:0; left:0; font-size:18px; font-weight:800; opacity:.95; }

  /* ---------- Oyun ogeleri ---------- */
  .track { position:relative; width:86%; height:46px; margin:0 auto; background:rgba(0,0,0,.45);
    border:2px solid rgba(255,255,255,.25); border-radius:23px; }
  .track::before { content:''; position:absolute; left:44%; width:12%; top:0; bottom:0; background:rgba(74,222,128,.4); }
  .track .mid { position:absolute; left:50%; top:-6px; bottom:-6px; width:4px; margin-left:-2px; background:#fff; border-radius:2px; }
  .track .mk { position:absolute; top:3px; width:36px; height:36px; margin-left:-18px; left:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff 0 10%, var(--c) 40%, color-mix(in srgb, var(--c) 55%, #000) 100%);
    border:3px solid #fff; box-shadow:0 2px 10px rgba(0,0,0,.5); }
  .pct { font-size:clamp(18px,5vmin,30px); margin-top:14px; font-weight:800; }

  .tgt { position:absolute; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff 0 9%, var(--c) 38%, color-mix(in srgb, var(--c) 55%, #000) 100%);
    border:3px solid #fff; box-shadow:0 0 18px var(--c), 0 3px 8px rgba(0,0,0,.5); animation:pop .15s ease-out; }
  @keyframes pop { from { transform:scale(.3); opacity:0; } to { transform:scale(1); opacity:1; } }

  .grid { display:grid; gap:8px; width:100%; margin:0 auto; align-content:center; height:100%;
    max-width:min(100%, calc((50dvh - 80px) * var(--ar, 1))); }
  .cell { display:flex; align-items:center; justify-content:center; aspect-ratio:1;
    background:linear-gradient(160deg, rgba(255,255,255,.26), rgba(255,255,255,.08));
    border:1px solid rgba(255,255,255,.28); border-radius:12px; box-shadow:0 3px 8px rgba(0,0,0,.35);
    font-size:clamp(22px, 6vmin, 36px); font-weight:800; transition:transform .06s, opacity .15s; }
  .cell:active { transform:scale(.93); }
  .cell.done { opacity:.25; }

  .quiz { width:100%; height:100%; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  .quiz .q { font-size:clamp(26px, 8vmin, 46px); font-weight:900; }
  .quiz .word { background:#05070f; padding:6px 14px; border-radius:12px; border:2px solid rgba(255,255,255,.25); text-shadow:none; }
  .quiz .opts { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; width:min(100%, 230px); }
  .quiz .opt { display:flex; align-items:center; justify-content:center; min-height:clamp(44px, 9vmin, 62px); border-radius:14px;
    background:linear-gradient(160deg, rgba(255,255,255,.3), rgba(255,255,255,.1)); border:1px solid rgba(255,255,255,.35);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.28), 0 3px 8px rgba(0,0,0,.35); font-size:clamp(20px, 6vmin, 30px); font-weight:800; }
  .quiz .opt:active { transform:translateY(2px); }

  .lamp { width:min(60%, 38vmin); aspect-ratio:1; border-radius:50%; margin:0 auto; border:6px solid rgba(255,255,255,.4);
    background:radial-gradient(circle at 35% 30%, #3a4468, #10162a 70%); transition:background .05s, box-shadow .05s; }
  .lamp.g { background:radial-gradient(circle at 35% 30%, #dcfce7, #22c55e 45%, #15803d); box-shadow:0 0 50px #22c55e; }
  .lamp.r { background:radial-gradient(circle at 35% 30%, #fee2e2, #ef4444 45%, #991b1b); box-shadow:0 0 50px #ef4444; }

  .pad { opacity:.6; transition:opacity .08s, transform .08s; border:2px solid rgba(255,255,255,.5); }
  .pad.lit { opacity:1; transform:scale(1.04); box-shadow:0 0 22px #fff; }

  .balloons { overflow:hidden; }
  .balloon { position:absolute; bottom:-100px; width:76px; height:92px; margin-left:-38px; border-radius:50% 50% 48% 48%;
    background:radial-gradient(circle at 35% 28%, rgba(255,255,255,.75) 0 10%, var(--bc) 42%, color-mix(in srgb, var(--bc) 60%, #000) 100%);
    display:flex; align-items:center; justify-content:center; font-size:34px; text-shadow:none;
    box-shadow:0 3px 8px rgba(0,0,0,.35); animation:rise 4s linear forwards; }
  .balloon::after { content:''; position:absolute; left:50%; bottom:-14px; width:2px; height:14px; background:rgba(255,255,255,.55); }
  .balloon.pop { transform:scale(1.7); opacity:0; transition:transform .15s, opacity .15s; }
  @keyframes rise { from { bottom:-100px; } to { bottom:100%; } }

  /* ---------- Efektler ---------- */
  .rip { position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; pointer-events:none;
    border:3px solid rgba(255,255,255,.85); animation:rip .45s ease-out forwards; z-index:3; }
  @keyframes rip { to { transform:scale(4); opacity:0; } }
  .conf { position:absolute; left:50%; top:50%; width:9px; height:14px; border-radius:2px; pointer-events:none; z-index:4;
    background:var(--k); animation:conf .95s ease-out forwards; }
  @keyframes conf { from { transform:translate(0,0) rotate(0); opacity:1; } to { transform:translate(var(--dx),var(--dy)) rotate(var(--r)); opacity:0; } }

  /* ---------- Bilgi kutusu: her iki yonden okunur ---------- */
  #hud { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:6px; max-width:86vw; }
  #hud.hidden { display:none; }
  .hline { background:rgba(8,10,20,.9); border:2px solid rgba(255,255,255,.3); border-radius:16px; padding:8px 16px;
    text-align:center; font-weight:800; font-size:16px; line-height:1.3; box-shadow:0 4px 18px rgba(0,0,0,.5);
    animation:hin .2s ease-out; text-shadow:none; }
  .hline.flip { transform:rotate(180deg); }
  .hline small { display:block; font-weight:500; opacity:.85; font-size:12px; }
  @keyframes hin { from { opacity:0; } to { opacity:1; } }
  #hud.mini { gap:3px; }
  #hud.mini .hline { padding:2px 12px; font-size:13px; border-radius:12px; border-width:1px; }
  #hud.mini .hline small { display:inline; margin-left:6px; font-size:12px; }

  #rotate { display:none; position:fixed; inset:0; z-index:30; background:var(--bg); align-items:center; justify-content:center;
    text-align:center; font-size:22px; font-weight:800; padding:24px; }
  @media (orientation:landscape) and (max-height:520px) { #rotate { display:flex; } }

  /* ---------- Menu ve oyun secimi ---------- */
  .screen { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px; text-align:center; overflow:hidden;
    background:radial-gradient(120% 80% at 50% 0%, #1a2350 0%, var(--bg) 70%); }
  .screen.hidden { display:none; }
  .screen::before, .screen::after { content:''; position:absolute; width:60vmin; height:60vmin; border-radius:50%; filter:blur(40px);
    opacity:.35; pointer-events:none; animation:drift 12s ease-in-out infinite alternate; }
  .screen::before { background:#ff5a5f; left:-20vmin; top:-10vmin; }
  .screen::after { background:#4dabf7; right:-20vmin; bottom:-10vmin; animation-delay:-6s; }
  @keyframes drift { to { transform:translate(12vmin,10vmin) scale(1.15); } }
  .screen > :not(.conf):not(.float) { position:relative; z-index:1; }
  .float { position:absolute; bottom:-12%; opacity:.22; pointer-events:none; animation:floatup linear infinite; }
  @keyframes floatup { to { transform:translateY(-125vh) rotate(40deg); } }
  .screen h1 { font-size:clamp(44px,14vw,84px); margin:0; letter-spacing:.04em; font-weight:900;
    background:linear-gradient(90deg,#ff5a5f,#ffd43b,#3ddc97,#4dabf7); -webkit-background-clip:text; background-clip:text;
    color:transparent; filter:drop-shadow(0 4px 14px rgba(0,0,0,.5)); }
  .screen h2 { margin:0; font-size:26px; font-weight:900; }
  .screen p { margin:0; opacity:.85; max-width:32ch; line-height:1.4; }
  .row { display:flex; gap:10px; }
  .lbl { font-weight:700; opacity:.9; }
  button { font:inherit; font-weight:800; color:var(--ink); background:linear-gradient(180deg,#26306a,#1a2250);
    border:2px solid #4452a0; border-radius:14px; padding:14px 22px; font-size:20px; cursor:pointer;
    box-shadow:0 4px 0 #0e1433; transition:transform .08s, box-shadow .08s; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #0e1433; }
  button.sel { background:linear-gradient(180deg,#7cc4ff,#4dabf7); border-color:#fff; color:#08101f; box-shadow:0 4px 0 #2b6ea8; }
  button.go { background:linear-gradient(180deg,#5eeab1,#3ddc97); border-color:#fff; color:#08101f; font-size:24px;
    padding:16px 40px; box-shadow:0 5px 0 #1f9566; }
  button.alt { background:linear-gradient(180deg,#ffd76a,#ffb703); border-color:#fff; color:#2a1800; font-size:22px;
    padding:14px 34px; box-shadow:0 5px 0 #b97f00; }
  #sound { font-size:15px; padding:9px 16px; }

  #picker { justify-content:flex-start; overflow-y:auto; touch-action:pan-y; padding-top:max(18px, env(safe-area-inset-top)); }
  #picker .ptop { width:100%; display:flex; align-items:center; gap:14px; }
  #picker .ptop button { font-size:16px; padding:8px 14px; }
  #pinfo { opacity:.8; font-size:14px; align-self:flex-start; }
  #cards { width:100%; display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; padding-bottom:24px; }
  .gcard { text-align:left; display:flex; flex-direction:column; gap:4px; padding:12px; font-size:15px; border-radius:16px;
    background:linear-gradient(160deg, hsl(var(--h) 55% 30%), hsl(var(--h) 45% 16%)); border:2px solid hsl(var(--h) 70% 58%);
    box-shadow:0 4px 0 hsl(var(--h) 50% 10%), 0 0 18px hsl(var(--h) 70% 40% / .35); }
  .gcard:active { box-shadow:0 1px 0 hsl(var(--h) 50% 10%); }
  .gcard .ic { font-size:34px; line-height:1; }
  .gcard .nm2 { font-size:16px; font-weight:900; }
  .gcard .ht { font-size:12px; font-weight:500; opacity:.8; line-height:1.3; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  /* ---------- Bitis cubugu (her iki yonden) ---------- */
  #endbar { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:8; display:flex; flex-direction:column;
    align-items:center; gap:8px; animation:hin .4s ease-out; }
  #endbar.hidden { display:none; }
  .endrow { display:flex; gap:8px; }
  .endrow.flip { transform:rotate(180deg); }
  #endbar button { font-size:15px; padding:8px 14px; }

  /* ---------- Genel grafik katmani ---------- */
  .zone::before { content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:radial-gradient(rgba(255,255,255,.07) 1.5px, transparent 2px); background-size:24px 24px;
    animation:bgmove 20s linear infinite; }
  .zone::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,.08), transparent 38%); }
  @keyframes bgmove { to { background-position:96px 48px; } }
  .score.bump { animation:bump .45s ease-out; }
  @keyframes bump { 30% { transform:scale(1.6); background:#fbbf24; color:#1a1200; } }
  .plus { position:absolute; left:50%; top:36%; z-index:5; font-size:40px; font-weight:900; color:#1a1200; text-shadow:none;
    transform:translateX(-50%); animation:plus 1.1s ease-out forwards; pointer-events:none; }
  @keyframes plus { to { transform:translate(-50%,-80px); opacity:0; } }
  .count { font-size:clamp(70px,24vmin,150px); font-weight:900; animation:cdp .55s ease-out; }
  @keyframes cdp { from { transform:scale(1.9); opacity:0; } to { transform:scale(1); opacity:1; } }

  /* bitis: kazanan yanip soner, digerleri soner */
  .zone[data-s="lose"] { background:radial-gradient(120% 90% at 50% 40%, #1a1f33, #0c101e); box-shadow:inset 0 0 0 3px #3a4056; }
  .zone[data-s="lose"]::before { animation-play-state:paused; }
  .zone[data-s="champ"] { color:#1a1200; text-shadow:none; animation:blink .7s steps(1, end) infinite; }
  .zone[data-s="champ"] .gname { color:#1a1200; }
  .zone[data-s="champ"] .body { animation:cheer .7s ease-in-out infinite; }
  @keyframes blink {
    0%   { background:radial-gradient(circle at 50% 40%, #fde68a 0%, #f59e0b 90%); box-shadow:inset 0 0 0 5px #fff7d6, 0 0 30px #fbbf24; }
    50%  { background:radial-gradient(circle at 50% 40%, #ffffff 0%, #fde047 80%); box-shadow:inset 0 0 0 5px #fff, 0 0 80px #fff176; }
  }
  @keyframes cheer { 50% { transform:scale(1.08); } }
  .final .crown { font-size:clamp(44px, 14vmin, 90px); line-height:1; }
  .final .rank { font-size:clamp(28px, 9vmin, 56px); font-weight:900; }
  .final .sub { font-size:clamp(16px, 4.5vmin, 24px); }

  /* balon: gokyuzu ve bulutlar */
  .zone.sky, .zone.sky[data-s="go"] { background:linear-gradient(180deg,#1e5fa8 0%,#4aa3e8 60%,#bfe3fa 100%); }
  .zone.sky::before { opacity:0; }
  .cloud { position:absolute; left:-30%; height:26px; width:90px; border-radius:40px; background:rgba(255,255,255,.55); filter:blur(5px);
    animation:cloud 16s linear infinite; pointer-events:none; }
  @keyframes cloud { to { transform:translateX(420%); } }

  /* oyun ogeleri */
  .tgt { background:radial-gradient(circle, #fff 0 12%, var(--c) 12% 30%, #fff 30% 46%, var(--c) 46% 100%) !important;
    border-color:#fff; }
  .hole { background:radial-gradient(circle at 50% 78%, #140d05 0 42%, #6b4423 44% 100%); font-size:34px; overflow:hidden; }
  .hole.up { animation:up .15s ease-out; }
  .hole.hit { background:radial-gradient(circle, #fde047, #f59e0b); }
  @keyframes up { from { transform:translateY(40%) scale(.6); } to { transform:none; } }
  .card { font-size:30px; }
  .card.open { background:linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,.25)); }
  .card.done { opacity:1; background:linear-gradient(160deg, rgba(74,222,128,.6), rgba(34,197,94,.3)); }
  .swarm { font-size:clamp(22px, 6vmin, 30px); line-height:1.2; max-width:210px; margin:0 auto; }
</style>
</head>
<body class="noselect">
<div id="board"></div>
<div id="hud" class="hidden"></div>
<div id="rotate">📱 Telefonu dikey tut</div>

<div id="menu" class="screen">
  <h1>DOKUN!</h1>
  <p>Aynı telefonu paylaşan arkadaşlar için hızlı mini oyunlar. Herkes kendi bölgesine dokunur.</p>
  <div class="lbl">Oyuncu sayısı</div>
  <div class="row" id="count-row">
    <button data-n="2" class="sel">2</button>
    <button data-n="3">3</button>
    <button data-n="4">4</button>
  </div>
  <div class="lbl">Tur sayısı</div>
  <div class="row" id="round-row">
    <button data-r="3">3</button>
    <button data-r="5">5</button>
    <button data-r="8" class="sel">8</button>
    <button data-r="12">12</button>
  </div>
  <button class="go" id="start">🎲 Karışık Maç</button>
  <button class="alt" id="pick-btn">🎮 Oyun Seç</button>
  <button id="sound">🔊 Ses ve titreşim: Açık</button>
</div>

<div id="picker" class="screen hidden">
  <div class="ptop"><button id="back">‹ Geri</button><h2>Oyun Seç</h2></div>
  <div id="pinfo"></div>
  <div id="cards"></div>
</div>

<div id="endbar" class="hidden">
  <div class="endrow flip"><button data-a="again">↻ Tekrar</button><button data-a="menu">☰ Menü</button></div>
  <div class="endrow"><button data-a="again">↻ Tekrar</button><button data-a="menu">☰ Menü</button></div>
</div>

<script>
(() => {
  const COLORS = ['#ff5a5f', '#3ddc97', '#4dabf7', '#ffd43b'];
  const $ = s => document.querySelector(s);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const board = $('#board'), hud = $('#hud'), menu = $('#menu');
  let mode = { type: 'mix', game: null };
  let N = 2, ROUNDS = 8, scores = [], zones = [], handler = null, upHandler = null;

  // ---------- Ses (Web Audio, dosya yok) ve titresim ----------
  const fx = (() => {
    let ctx = null, on = true;
    try { on = localStorage.getItem('dokun-ses') !== 'kapali'; } catch (_) {}
    const ensure = () => {
      if (!on) return null;
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    };
    const tone = (freq, dur, o = {}) => {
      const c = ensure(); if (!c) return;
      const { type = 'sine', vol = 0.2, at = 0, slide = 0 } = o;
      const t = c.currentTime + at, osc = c.createOscillator(), g = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    };
    const vib = pattern => { if (on && navigator.vibrate) { try { navigator.vibrate(pattern); } catch (_) {} } };
    return {
      get on() { return on; },
      unlock: ensure,
      toggle() {
        on = !on;
        try { localStorage.setItem('dokun-ses', on ? 'acik' : 'kapali'); } catch (_) {}
        if (on) { tone(660, 0.08); vib(30); }
        return on;
      },
      tick()  { tone(900, 0.04, { type: 'square', vol: 0.04 }); vib(8); },
      count() { tone(520, 0.12, { type: 'triangle', vol: 0.2 }); vib(12); },
      hit()   { tone(660, 0.07, { vol: 0.15 }); tone(990, 0.09, { at: 0.06, vol: 0.15 }); vib(20); },
      go()    { tone(880, 0.18, { type: 'triangle', vol: 0.25 }); vib(60); },
      bad()   { tone(180, 0.25, { type: 'sawtooth', vol: 0.15, slide: -80 }); vib([60, 40, 60]); },
      round() { tone(520, 0.08, { vol: 0.15 }); tone(780, 0.1, { at: 0.09, vol: 0.15 }); },
      win()   { [523, 659, 784].forEach((f, k) => tone(f, 0.14, { at: k * 0.09, vol: 0.2, type: 'triangle' })); vib([40, 30, 80]); },
      none()  { tone(300, 0.2, { vol: 0.15, slide: -100 }); },
      fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, k) => tone(f, 0.2, { at: k * 0.14, vol: 0.22, type: 'triangle' })); vib([80, 50, 80, 50, 200]); },
    };
  })();
  document.addEventListener('pointerdown', () => fx.unlock(), { passive: true });

  // ---------- Gorsel efektler ----------
  const ripple = (z, e, flipped) => {
    const r = z.getBoundingClientRect();
    let x = e.clientX - r.left, y = e.clientY - r.top;
    if (flipped) { x = r.width - x; y = r.height - y; }
    const d = document.createElement('div');
    d.className = 'rip'; d.style.left = x + 'px'; d.style.top = y + 'px';
    d.addEventListener('animationend', () => d.remove());
    z.appendChild(d);
  };
  const CONF = ['#ff5a5f', '#3ddc97', '#4dabf7', '#ffd43b', '#c084fc', '#fb923c'];
  const burst = (el, n = 18) => {
    for (let k = 0; k < n; k++) {
      const c = document.createElement('div'), a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
      c.className = 'conf';
      c.style.setProperty('--k', CONF[Math.floor(Math.random() * CONF.length)]);
      c.style.setProperty('--dx', Math.cos(a) * d + 'px');
      c.style.setProperty('--dy', Math.sin(a) * d + 'px');
      c.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      c.addEventListener('animationend', () => c.remove());
      el.appendChild(c);
    }
  };

  // ---------- Arayuz yardimcilari ----------
  function build() {
    board.innerHTML = '';
    board.className = 'p' + N;
    zones = [];
    for (let i = 0; i < N; i++) {
      const z = document.createElement('div');
      z.className = 'zone';
      z.style.setProperty('--c', COLORS[i]);
      const flipped = N === 2 ? i === 0 : i < 2;       // ust siradaki oyuncular karsidan oynar
      if (flipped) z.classList.add('flip');
      z.innerHTML = '<div class="head"><span class="nm">Oyuncu ' + (i + 1) + '</span><span class="gname"></span><span class="score">0</span></div><div class="body"></div>';
      z.addEventListener('pointerdown', e => {
        e.preventDefault();
        try { z.setPointerCapture(e.pointerId); } catch (_) {}
        ripple(z, e, flipped);
        if (handler) { fx.tick(); handler(i, e); }
      });
      const up = () => { if (upHandler) upHandler(i); };
      z.addEventListener('pointerup', up);
      z.addEventListener('pointercancel', up);
      board.appendChild(z);
      zones.push(z);
    }
  }
  const body = (i, html) => { zones[i].querySelector('.body').innerHTML = html; };
  const setS = (i, s) => { zones[i].dataset.s = s || ''; };
  const showScores = () => zones.forEach((z, i) => {
    const el = z.querySelector('.score');
    if (el.textContent != scores[i]) { el.textContent = scores[i]; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  });
  const resetZones = () => zones.forEach((z, i) => { setS(i, ''); body(i, ''); z.classList.remove('sky'); z.querySelector('.body').classList.remove('fill'); });
  const arena = (i, html) => { const b = zones[i].querySelector('.body'); b.classList.add('fill'); b.innerHTML = html; };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const topScorers = arr => { const m = Math.max(...arr); return m > 0 ? arr.map((v, i) => v === m ? i : -1).filter(i => i >= 0) : []; };
  function say(main, sub, big) {
    const h = main + (sub ? '<small>' + sub + '</small>' : '');
    hud.innerHTML = '<div class="hline flip">' + h + '</div><div class="hline">' + h + '</div>';
    hud.classList.toggle('mini', !big);
    hud.classList.remove('hidden');
  }

  // ---------- Mini oyunlar: kazananlarin indeksini dondurur ----------
  async function reaction() {
    const out = new Set();
    let go = false, winner = -1, done = false;
    zones.forEach((_, i) => body(i, 'Hazır…'));
    await new Promise(res => {
      const finish = () => { done = true; res(); };
      handler = i => {
        if (done || out.has(i)) return;
        if (!go) {                                    // erken dokundu: bu turdan elendi
          out.add(i); setS(i, 'out'); body(i, 'Erken! ✖'); fx.bad();
          if (out.size === N) finish();
          return;
        }
        winner = i; finish();
      };
      setTimeout(() => {
        if (done) return;
        go = true;
        zones.forEach((_, i) => { if (!out.has(i)) { setS(i, 'sig'); body(i, 'DOKUN!'); } });
        fx.go();
        setTimeout(() => { if (!done) finish(); }, 3000);
      }, 1500 + Math.random() * 2500);
    });
    handler = null;
    return winner >= 0 ? [winner] : [];
  }

  async function spam() {
    const c = Array(N).fill(0);
    zones.forEach((_, i) => body(i, 'Hazır…'));
    await sleep(1200);
    zones.forEach((_, i) => { setS(i, 'go'); body(i, '0'); });
    fx.go();
    handler = i => { c[i]++; body(i, c[i]); };
    const end = performance.now() + 5000;
    while (performance.now() < end) {
      say('Çılgınca dokun!', Math.ceil((end - performance.now()) / 1000) + ' sn');
      await sleep(100);
    }
    handler = null;
    const max = Math.max(...c);
    return max > 0 ? c.map((v, i) => v === max ? i : -1).filter(i => i >= 0) : [];
  }

  async function stopbar() {
    zones.forEach((_, i) => {
      setS(i, 'go');
      body(i, '<div class="track"><div class="mid"></div><div class="mk"></div></div><div class="pct">&nbsp;</div>');
    });
    const speed = zones.map(() => 0.7 + Math.random() * 0.7);
    const phase = zones.map(() => Math.random() * 2);
    const pos = Array(N).fill(null);
    const posAt = (i, t) => { const x = (t / 1000 * speed[i] + phase[i]) % 2; return x < 1 ? x : 2 - x; };
    const t0 = performance.now();
    const mk = i => zones[i].querySelector('.mk');
    const mkLeft = p => 'calc(18px + (100% - 36px) * ' + p + ')';
    await new Promise(res => {
      let raf;
      const finish = () => { cancelAnimationFrame(raf); res(); };
      handler = i => {
        if (pos[i] !== null) return;
        pos[i] = posAt(i, performance.now() - t0);
        mk(i).style.left = mkLeft(pos[i]);
        if (pos.every(p => p !== null)) setTimeout(finish, 300);
      };
      const tick = () => {
        const t = performance.now() - t0;
        zones.forEach((_, i) => { if (pos[i] === null) mk(i).style.left = mkLeft(posAt(i, t)); });
        if (t > 6000) { finish(); return; }
        raf = requestAnimationFrame(tick);
      };
      say('Topu ortadaki çizgide durdur!');
      tick();
    });
    handler = null;
    const dist = pos.map(p => p === null ? 1 : Math.abs(p - 0.5));
    zones.forEach((z, i) => {
      z.querySelector('.pct').textContent = pos[i] === null ? 'Durdurmadı' : '%' + Math.round((1 - dist[i] * 2) * 100);
    });
    const best = Math.min(...dist);
    return best < 1 ? [dist.indexOf(best)] : [];
  }

  async function targets() {
    const GOAL = 6, cnt = Array(N).fill(0);
    let winner = -1;
    const place = i => {
      const t = zones[i].querySelector('.tgt');
      t.style.left = (15 + Math.random() * 70) + '%';

    zones.forEach((_, i) => {

        cnt[i]++; fx.hit();
        zones[i].querySelector('.cnt').textContent = cnt[i] + '/' + GOAL;
        if (cnt[i] >= GOAL) { winner = i; res(); } else place(i);

  async function numbers() {
    const next = Array(N).fill(1);
    let winner = -1;
    zones.forEach((_, i) => {
      arena(i, '<div class="grid" style="--ar:.67;grid-template-columns:repeat(2,1fr)">' +

      setS(i, 'go');

        if (n !== next[i]) { fx.bad(); return; }
        e.target.classList.add('done'); fx.hit();
        if (++next[i] > 6) { winner = i; res(); }

      setTimeout(res, 15000);

    return winner >= 0 ? [winner] : topScorers(next.map(v => v - 1));

  async function odd() {
    const pairs = [['🙂', '🙃'], ['🍎', '🍅'], ['🔵', '🟣'], ['🐱', '🐯'], ['🍋', '🧀'], ['🐶', '🐺'], ['🍇', '🫐']];
    const [a, b] = pairs[Math.floor(Math.random() * pairs.length)];
    const lock = Array(N).fill(false);
    let winner = -1;
    zones.forEach((_, i) => {
      const k = Math.floor(Math.random() * 12);
      let h = '';
      for (let c = 0; c < 12; c++) h += '<div class="cell" data-odd="' + (c === k ? 1 : 0) + '">' + (c === k ? b : a) + '</div>';
      arena(i, '<div class="grid" style="--ar:.75;grid-template-columns:repeat(3,1fr)">' + h + '</div>');
      setS(i, 'go');
    });
    await new Promise(res => {
      handler = (i, e) => {
        if (winner >= 0 || lock[i] || e.target.dataset.odd === undefined) return;
        if (e.target.dataset.odd === '1') { winner = i; res(); return; }
        lock[i] = true; setS(i, 'out'); fx.bad();                  // yanlis dokunus: 1,2 sn ceza
        setTimeout(() => { lock[i] = false; if (winner < 0) setS(i, 'go'); }, 1200);
      };
      setTimeout(res, 12000);
    });
    handler = null;
    return winner >= 0 ? [winner] : [];
  }

  async function hold() {
    const TARGET = 3000, st = Array(N).fill(null), en = Array(N).fill(null);
    zones.forEach((_, i) => body(i, 'Basılı tut<div class="sub">3 sn dolunca bırak</div>'));
    await new Promise(res => {
      let timer;
      const done = () => { clearInterval(timer); res(); };
      handler = i => { if (st[i] === null) { st[i] = performance.now(); setS(i, 'go'); } };
      upHandler = i => {
        if (st[i] === null || en[i] !== null) return;
        en[i] = performance.now(); setS(i, ''); body(i, 'Bıraktın');
        if (en.every(x => x !== null)) setTimeout(done, 300);
      };
      timer = setInterval(() => {
        const now = performance.now();
        zones.forEach((_, i) => {
          if (st[i] !== null && en[i] === null) { const t = now - st[i]; body(i, t < 1000 ? (t / 1000).toFixed(1) + ' sn' : '?'); }
        });
      }, 50);
      setTimeout(done, 10000);
    });
    handler = null; upHandler = null;
    const err = en.map((e, i) => e === null ? Infinity : Math.abs((e - st[i]) - TARGET));
    zones.forEach((_, i) => body(i, en[i] === null ? '—' : ((en[i] - st[i]) / 1000).toFixed(2) + ' sn'));
    const best = Math.min(...err);
    return isFinite(best) ? [err.indexOf(best)] : [];
  }

  // ----- Ortak: soru-cevap oyunu (ilk 'goal' dogruya ulasan kazanir; yanlista 1 sn ceza) -----
  async function quizGame(makeQ, goal = 4, timeout = 20000) {
    const cnt = Array(N).fill(0), cur = [], lock = Array(N).fill(false);
    let winner = -1;
    const draw = i => {
      const q = makeQ();
      cur[i] = q.correct;
      zones[i].querySelector('.q').innerHTML = q.html;
      zones[i].querySelector('.opts').innerHTML = q.options.map((o, j) =>
        '<div class="opt" data-j="' + j + '"' + (o.style ? ' style="' + o.style + '"' : '') + '>' + o.html + '</div>').join('');
    };
    zones.forEach((_, i) => {
      arena(i, '<div class="quiz"><div class="cnt">0/' + goal + '</div><div class="q"></div><div class="opts"></div></div>');
      setS(i, 'go'); draw(i);
    });
    await new Promise(res => {
      handler = (i, e) => {
        if (winner >= 0 || lock[i]) return;
        const o = e.target.closest('.opt'); if (!o) return;
        if (+o.dataset.j === cur[i]) {
          cnt[i]++; fx.hit();
          zones[i].querySelector('.cnt').textContent = cnt[i] + '/' + goal;
          if (cnt[i] >= goal) { winner = i; res(); return; }
          draw(i);
        } else {
          lock[i] = true; setS(i, 'out'); fx.bad();
          setTimeout(() => { lock[i] = false; if (winner < 0) setS(i, 'go'); }, 1000);
        }
      };
      setTimeout(res, timeout);
    });
    handler = null;
    return winner >= 0 ? [winner] : topScorers(cnt);
  }

  const INK = [['KIRMIZI', '#ef4444'], ['MAVİ', '#3b82f6'], ['YEŞİL', '#22c55e'], ['SARI', '#facc15']];
  const stroop = () => quizGame(() => {
    const w = Math.floor(Math.random() * 4);
    let c; do { c = Math.floor(Math.random() * 4); } while (c === w);
    const order = shuffle([0, 1, 2, 3]);
    return {
      html: '<span class="word" style="color:' + INK[c][1] + '">' + INK[w][0] + '</span>',
      options: order.map(k => ({ html: '', style: 'background:' + INK[k][1] })),
      correct: order.indexOf(c),
    };
  });

  const math = () => quizGame(() => {
    const plus = Math.random() < 0.6;
    let a = 2 + Math.floor(Math.random() * 9), b = 2 + Math.floor(Math.random() * 9);
    if (!plus && b > a) [a, b] = [b, a];
    const ans = plus ? a + b : a - b;
    const set = new Set([ans]);
    while (set.size < 4) { const v = ans + Math.floor(Math.random() * 7) - 3; if (v >= 0) set.add(v); }
    const opts = shuffle([...set]);
    return { html: a + (plus ? ' + ' : ' − ') + b, options: opts.map(v => ({ html: v })), correct: opts.indexOf(ans) };
  });

  async function lights() {
    const ROUNDS = 12, sc = Array(N).fill(0), tapped = Array(N).fill(false);
    let on = null;                                       // null | 'g' | 'r'

    });
    paint();
    handler = i => {
      if (!on || tapped[i]) return;
      tapped[i] = true;
      if (on === 'g') { sc[i]++; fx.hit(); } else { sc[i]--; fx.bad(); }
      paint2(i);
    };
    const paint2 = i => { zones[i].querySelector('.sub').textContent = 'Puan: ' + sc[i]; };
    for (let k = 0; k < ROUNDS; k++) {
      await sleep(500 + Math.random() * 700);
      tapped.fill(false);
      on = Math.random() < 0.65 ? 'g' : 'r';
      zones.forEach(z => { z.querySelector('.lamp').className = 'lamp ' + on; });
      await sleep(650);
      on = null;
      zones.forEach(z => { z.querySelector('.lamp').className = 'lamp'; });
    }
    handler = null;
    return topScorers(sc);
  }

  async function simon() {

    const seq = Array.from({ length: LEN }, () => Math.floor(Math.random() * 4));

      arena(i, '<div class="grid" style="--ar:1;grid-template-columns:repeat(2,1fr)">' +

  async function balloons() {
    const sc = Array(N).fill(0), BC = ['#ff5a5f', '#3ddc97', '#4dabf7', '#ffd43b', '#c084fc', '#fb923c'];
    zones.forEach((z, i) => {
      z.classList.add('sky');
      arena(i, '<div class="arena balloons"><div class="cnt">0</div>' +
        '<div class="cloud" style="top:14%;animation-duration:19s"></div><div class="cloud" style="top:46%;width:70px;animation-duration:25s;animation-delay:-9s"></div>' +
        '<div class="cloud" style="top:74%;animation-duration:22s;animation-delay:-15s"></div></div>');
      setS(i, 'go');
    });
    // Kolay dokunus: tam ustune basmak gerekmez, dokunulan yere en yakin balon (70 px icinde) patlar.
    handler = (i, e) => {
      let best = null, bd = 1e9;
      zones[i].querySelectorAll('.balloon').forEach(b => {
        if (b.dataset.dead) return;
        const r = b.getBoundingClientRect(), d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
        if (d < bd) { bd = d; best = b; }
      });
      if (!best || bd > 70) return;
      best.dataset.dead = 1; best.classList.add('pop'); setTimeout(() => best.remove(), 160);
      if (best.dataset.bomb) { sc[i] = Math.max(0, sc[i] - 1); fx.bad(); } else { sc[i]++; fx.hit(); }
      zones[i].querySelector('.cnt').textContent = sc[i];
    };
    const spawn = () => zones.forEach(z => {
      const a = z.querySelector('.arena');
      if (!a) return;
      const bomb = Math.random() < 0.12, b = document.createElement('div');
      b.className = 'balloon';
      b.style.left = (18 + Math.random() * 64) + '%';

      b.addEventListener('animationend', () => b.remove());
      a.appendChild(b);
    });
    const timer = setInterval(spawn, 650);
    spawn();
    await sleep(10000);
    clearInterval(timer); handler = null;
    zones.forEach(z => z.querySelectorAll('.balloon').forEach(b => b.remove()));
    return topScorers(sc);
  }

  async function moles() {
    const sc = Array(N).fill(0), DUR = 10000;
    zones.forEach((_, i) => {
      arena(i, '<div class="arena"><div class="cnt">0</div><div class="grid" style="--ar:1;grid-template-columns:repeat(3,1fr)">' +
        Array.from({ length: 9 }, () => '<div class="cell hole"></div>').join('') + '</div></div>');

    });
    handler = (i, e) => {
      const c = e.target.closest('.hole');
      if (!c || !c.dataset.up) return;
      c.dataset.up = ''; c.textContent = ''; c.classList.remove('up'); c.classList.add('hit');
      setTimeout(() => c.classList.remove('hit'), 200);
      sc[i]++; fx.hit();
      zones[i].querySelector('.cnt').textContent = sc[i];
    };
    const t0 = performance.now();
    let alive = true;
    const tick = () => {
      if (!alive) return;
      const life = 1200 - (performance.now() - t0) / DUR * 450;      // zamanla hizlanir
      zones.forEach(z => {
        const free = [...z.querySelectorAll('.hole')].filter(h => !h.dataset.up);

      });
      setTimeout(tick, 520 + Math.random() * 220);
    };
    tick();
    await sleep(DUR);
    alive = false; handler = null;
    return topScorers(sc);
  }

    };
  }, 5);

  const counting = () => quizGame(() => {
    const n = 3 + Math.floor(Math.random() * 7), em = ['🐝', '⭐', '🍎', '🐟', '🎈'][Math.floor(Math.random() * 5)];
    let h = '';
    for (let k = 0; k < n; k++) h += '<span style="display:inline-block;margin:' + (Math.random() * 6) + 'px ' + (Math.random() * 8) + 'px">' + em + '</span>';
    const set = new Set([n]);
    while (set.size < 4) { const v = n + Math.floor(Math.random() * 5) - 2; if (v >= 1) set.add(v); }
    const opts = shuffle([...set]);
    return { html: '<div class="swarm">' + h + '</div>', options: opts.map(v => ({ html: v })), correct: opts.indexOf(n) };
  }, 4);

  async function memory() {
    const E = ['🐶', '🐱', '🦊', '🐸', '🐵', '🦄', '🐙', '🍕'], PAIRS = 4;
    const matched = Array(N).fill(0), first = Array(N).fill(null), lock = Array(N).fill(false);
    let winner = -1;
    zones.forEach((_, i) => {
      const em = shuffle(E).slice(0, PAIRS), cards = shuffle([...em, ...em]);
      arena(i, '<div class="arena"><div class="cnt">0/' + PAIRS + '</div><div class="grid" style="--ar:.46;grid-template-columns:repeat(2,1fr)">' +
        cards.map(c => '<div class="cell card" data-e="' + c + '">❓</div>').join('') + '</div></div>');
      setS(i, 'go');
    });
    await new Promise(res => {
      handler = (i, e) => {
        if (winner >= 0 || lock[i]) return;
        const c = e.target.closest('.card');
        if (!c || c.classList.contains('open') || c.classList.contains('done')) return;
        c.classList.add('open'); c.textContent = c.dataset.e; fx.tick();
        const f = first[i];
        if (!f) { first[i] = c; return; }
        first[i] = null;
        if (f.dataset.e === c.dataset.e) {
          f.classList.add('done'); c.classList.add('done'); matched[i]++; fx.hit();
          zones[i].querySelector('.cnt').textContent = matched[i] + '/' + PAIRS;
          if (matched[i] >= PAIRS) { winner = i; res(); }
        } else {
          lock[i] = true;
          setTimeout(() => {
            [f, c].forEach(x => { x.classList.remove('open'); x.textContent = '❓'; });
            lock[i] = false;
          }, 650);
        }
      };
      setTimeout(res, 30000);
    });
    handler = null;
    return winner >= 0 ? [winner] : topScorers(matched);
  }

  const GAMES = [
    { icon: '⚡', name: 'Tepki', hint: 'Yeşil olunca ilk dokunan kazanır. Erken dokunan elenir!', run: reaction },
    { icon: '👆', name: 'Seri Dokun', hint: '5 saniyede en çok dokunan kazanır.', run: spam },
    { icon: '🎯', name: 'Tam Ortada', hint: 'Top ortaya en yakın durursa kazanırsın.', run: stopbar },
    { icon: '🏹', name: 'Hedef Avı', hint: 'Çıkan daireye dokun. 6 hedefe ilk ulaşan kazanır.', run: targets },
    { icon: '🔢', name: 'Sayı Sırası', hint: "1'den 6'ya sırayla dokun. İlk bitiren kazanır.", run: numbers },
    { icon: '🔍', name: 'Tek Farklı', hint: 'Farklı olanı bul! Yanlış dokunana ceza var.', run: odd },
    { icon: '🎨', name: 'Renk Tuzağı', hint: 'Yazının ne yazdığına değil RENGİNE bak! Doğru rengi seç, ilk 4 doğruya ulaşan kazanır.', run: stroop },
    { icon: '➕', name: 'Hızlı Matematik', hint: 'Doğru sonucu seç. İlk 4 doğruya ulaşan kazanır, yanlışta 1 sn ceza.', run: math },
    { icon: '🚦', name: 'Işık Oyunu', hint: 'Yeşilde dokun, kırmızıda DOKUNMA! Yanlış dokunuş puan düşürür.', run: lights },
    { icon: '🧠', name: 'Renk Dizisi', hint: 'Yanıp sönen renkleri aynı sırayla tekrarla. İlk bitiren kazanır.', run: simon },
    { icon: '🎈', name: 'Balon Patlat', hint: '10 saniyede en çok balonu patlat. Balona yakın bir yere dokunman yeter. 💣 bomba 1 puan götürür.', run: balloons },
    { icon: '⏱️', name: 'Tut ve Bırak', hint: "Basılı tut, 3 saniye dolunca bırak. İlk 1 sn sayaç görünür, sonra gizlenir!", run: hold },
    { icon: '🐹', name: 'Köstebek Avı', hint: 'Deliklerden çıkan köstebeğe dokun. 10 saniyede en çok vuran kazanır.', run: moles },
    { icon: '🧭', name: 'Ok Yönü', hint: 'Okun yönünü seç. "TERSİNE" yazıyorsa karşı yönü seç! İlk 5 doğruya ulaşan kazanır.', run: arrows },
    { icon: '🃏', name: 'Hafıza Eşleştir', hint: 'Kartları çevirip 4 çifti ilk bulan kazanır.', run: memory },
    { icon: '🐝', name: 'Say Bakalım', hint: 'Ekrandaki şekilleri say, doğru sayıyı seç. İlk 4 doğruya ulaşan kazanır.', run: counting },
  ];

  // ---------- Ekranlar ----------
  const picker = $('#picker'), endbar = $('#endbar');
  const showScreen = name => {
    menu.classList.toggle('hidden', name !== 'home');
    picker.classList.toggle('hidden', name !== 'picker');
  };
  const FLOAT = ['🎈', '🎯', '⚡', '🧠', '🐹', '🃏', '🎨', '🔢'];
  [menu, picker].forEach(el => FLOAT.forEach((e, k) => {
    const f = document.createElement('span');
    f.className = 'float'; f.textContent = e;
    f.style.left = (6 + k * 12) + '%'; f.style.fontSize = (22 + (k % 3) * 12) + 'px';
    f.style.animationDuration = (15 + k * 1.7) + 's'; f.style.animationDelay = (-k * 2.9) + 's';
    el.appendChild(f);
  }));

  // ---------- Oyun akisi ----------
  async function countdown() {
    for (const n of [3, 2, 1]) {
      zones.forEach((_, i) => body(i, '<div class="count">' + n + '</div>'));
      fx.count();
      await sleep(550);
    }
  }

  async function play() {
    scores = Array(N).fill(0);
    build();
    showScreen(null);
    endbar.classList.add('hidden');
    const deck = mode.type === 'single' ? Array(ROUNDS).fill(mode.game) : shuffle(GAMES).slice(0, ROUNDS);
    for (let r = 1; r <= deck.length; r++) {
      const g = deck[r - 1];
      resetZones(); showScores(); fx.round();
      // dar bolgelerde (3-4 oyuncu) oyun adi sigmaz: yalnizca tur numarasi
      zones.forEach(z => { z.querySelector('.gname').textContent = z.clientWidth >= 260 ? g.name + ' · ' + r + '/' + deck.length : r + '/' + deck.length; });
      if (mode.type === 'mix' || r === 1) {
        say(g.icon + ' ' + g.name + ' <small>Tur ' + r + '/' + deck.length + ' · ' + g.hint + '</small>', null, true);
        await sleep(2400);
        hud.classList.add('hidden');
      } else {
        await sleep(700);
      }
      await countdown();
      const winners = await g.run();
      winners.forEach(i => {
        scores[i]++; setS(i, 'win'); burst(zones[i]);
        const pl = document.createElement('div'); pl.className = 'plus'; pl.textContent = '+1';
        pl.addEventListener('animationend', () => pl.remove()); zones[i].appendChild(pl);
      });
      showScores();
      if (winners.length) fx.win(); else fx.none();
      say(winners.length ? winners.map(i => 'Oyuncu ' + (i + 1)).join(' & ') + ' +1' : 'Kimse puan alamadı', null, true);
      await sleep(1800);
    }
    await finale();
  }

  // Bitis: kazanan bolge(ler) altin renkte yanip soner ve "KAZANAN" yazar; digerleri soner ve siralamasini gosterir.
  // Her bolgenin yazisi kendi oyuncusuna dogru donuk oldugu icin sonuc iki yonden de okunur.
  async function finale() {
    hud.classList.add('hidden');
    fx.fanfare();
    const max = Math.max(...scores);
    const win = scores.map((s, i) => s === max ? i : -1).filter(i => i >= 0);
    const tie = win.length > 1;
    const rank = scores.map(s => 1 + scores.filter(x => x > s).length);
    zones.forEach((z, i) => {
      z.querySelector('.body').classList.remove('fill'); z.classList.remove('sky');
      const champ = win.includes(i);
      setS(i, champ ? 'champ' : 'lose');
      body(i, champ
        ? '<div class="final"><div class="crown">' + (tie ? '🤝' : '👑') + '</div><div class="rank">' + (tie ? 'BERABERE' : 'KAZANAN') + '</div><div class="sub">' + scores[i] + ' puan</div></div>'
        : '<div class="final"><div class="rank">' + rank[i] + '.</div><div class="sub">' + scores[i] + ' puan</div></div>');
    });
    win.forEach(i => burst(zones[i], 26));
    let k = 0;
    const timer = setInterval(() => { win.forEach(i => burst(zones[i], 22)); if (++k > 6) clearInterval(timer); }, 900);
    await sleep(2500);                                 // kazara dokunusla cikilmasin diye kisa bekleme
    endbar.classList.remove('hidden');
  }

  // ---------- Menu ----------
  const pickRow = (id, key) => $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    key(b);
    [...$(id).children].forEach(x => x.classList.toggle('sel', x === b));
  });
  pickRow('#count-row', b => { N = +b.dataset.n; });
  pickRow('#round-row', b => { ROUNDS = +b.dataset.r; });
  const soundBtn = $('#sound');
  const paintSound = () => { soundBtn.textContent = fx.on ? '🔊 Ses ve titreşim: Açık' : '🔇 Ses ve titreşim: Kapalı'; };
  soundBtn.addEventListener('click', () => { fx.toggle(); paintSound(); });
  paintSound();

  $('#cards').innerHTML = GAMES.map((g, k) =>
    '<button class="gcard" data-k="' + k + '" style="--h:' + (k * 360 / GAMES.length) + '"><span class="ic">' + g.icon + '</span>' +
    '<span class="nm2">' + g.name + '</span><span class="ht">' + g.hint + '</span></button>').join('');
  $('#cards').addEventListener('click', e => {
    const c = e.target.closest('.gcard'); if (!c) return;
    mode = { type: 'single', game: GAMES[+c.dataset.k] };
    play();
  });
  $('#pick-btn').addEventListener('click', () => {
    $('#pinfo').textContent = N + ' oyuncu · ' + ROUNDS + ' tur (ayarları ana menüden değiştir)';
    picker.scrollTop = 0;
    showScreen('picker');
  });
  $('#back').addEventListener('click', () => showScreen('home'));
  $('#start').addEventListener('click', () => { mode = { type: 'mix', game: null }; play(); });
  endbar.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    endbar.classList.add('hidden');
    if (b.dataset.a === 'again') play(); else { zones = []; board.innerHTML = ''; showScreen('home'); }
  });
  showScreen('home');

  // test icin disariya ac
  document.addEventListener('contextmenu', e => e.preventDefault());
  window.__dokun = { get scores() { return scores; }, get zones() { return zones; }, GAMES, resetZones, fx, say, finish: finale, burst, setS,
    setup(n) { N = n; scores = Array(N).fill(0); build(); showScreen(null); } };
})();
</script>
</body>
</html>
